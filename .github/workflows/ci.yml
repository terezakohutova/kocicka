name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Ruff
        run: |
          python -m pip install ruff==0.17.0
          ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile
        run: python -m py_compile kocicka.py tools/gen_md.py tools/pose.py tests/test_kocicka.py

      - name: Single-file smoke check (what KOCICKA.md readers run)
        run: python -c "import kocicka; kocicka.smoke(); print('ok')"

      - name: Tests (Linux, under a virtual display so the drawing tests run)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

      - name: KOCICKA.md matches kocicka.py
        shell: bash
        run: |
          python tools/gen_md.py
          git diff --exit-code KOCICKA.md
