name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile
        run: python -m py_compile kocicka.py tools/gen_md.py tools/pose.py tests/test_kocicka.py

      - name: Self-test
        run: python kocicka.py --selftest

      - name: Tests (Linux, under a virtual display so the drawing tests run)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

      - name: KOCICKA.md matches kocicka.py
        shell: bash
        run: |
          python tools/gen_md.py
          git diff --exit-code KOCICKA.md
